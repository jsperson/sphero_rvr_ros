planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Count an in-place heading correction as real progress so a smooth
      # terminal arrival cannot fail solely for stopping translation.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.02
      required_movement_angle: 0.10
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Exploration needs a useful arrival, not a precision final bearing.
      # Match the RPP rotation threshold so no unacceptable heading error is
      # too small for the controller to correct.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35
    FollowPath:
      # RotationShimController: rotate in place to face the path, then hand to
      # RPP for straight driving. Matches a drivetrain that can only pivot in
      # place or drive straight (no smooth low-speed arcs), so it avoids the
      # turn-hunting jitter of pure path-following. RPP's own in-place rotation
      # is disabled; the shim owns rotation.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 0.785
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      desired_linear_vel: 0.12
      lookahead_dist: 0.30
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.40
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.20
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      allow_reversing: false
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      initial_transform_timeout: 15.0
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.14
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          raytrace_max_range: 6.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.16

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      initial_transform_timeout: 15.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.14
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
        restore_cleared_footprint: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          raytrace_max_range: 6.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.16

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Recovery behaviors: when a goal fails to make progress, the recovery BT
    # clears costmaps then tries spin / wait / backup so exploration continues
    # instead of ending. Safe now that turning works; all recovery motion still
    # passes through /cmd_vel -> collision supervisor -> driver.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Rotational limits for Spin; the driver's closed-loop pivot executes the
    # turn, and the collision supervisor still gates it.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 0.8

lifecycle_manager_explore:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
