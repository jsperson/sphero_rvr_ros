planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 100000
      max_on_approach_iterations: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      # Count an in-place heading correction as real progress so a smooth
      # terminal arrival cannot fail solely for stopping translation.
      plugin: "nav2_controller::PoseProgressChecker"
      required_movement_radius: 0.02
      required_movement_angle: 0.10
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # Exploration needs a useful arrival, not a precision final bearing.
      # Match the RPP rotation threshold so no unacceptable heading error is
      # too small for the controller to correct.
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.35
    FollowPath:
      # RotationShimController: rotate in place to face the path, then hand to
      # RPP for straight driving. Matches a drivetrain that can only pivot in
      # place or drive straight (no smooth low-speed arcs), so it avoids the
      # turn-hunting jitter of pure path-following. RPP's own in-place rotation
      # is disabled; the shim owns rotation.
      plugin: "nav2_rotation_shim_controller::RotationShimController"
      primary_controller: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      angular_dist_threshold: 1.4
      forward_sampling_distance: 0.5
      rotate_to_heading_angular_vel: 0.4
      max_angular_accel: 0.8
      simulate_ahead_time: 1.0
      rotate_to_goal_heading: false
      desired_linear_vel: 0.20
      lookahead_dist: 0.26
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.36
      lookahead_time: 1.3
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.12
      approach_velocity_scaling_dist: 0.05
      # Off: the independent lidar collision-stop supervisor is the sole side/
      # front safety (it owns /cmd_vel_motor and measures real clearances). RPP's
      # internal check was second-guessing and aborting near walls it wasn't going
      # to hit ("failed to make progress" with the brake CLEAR), stalling the rover
      # short of gaps it fits. Let RPP just drive the path; the supervisor stops
      # only on a genuine imminent hit.
      use_collision_detection: false
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: false
      use_cost_regulated_linear_velocity_scaling: false
      use_fixed_curvature_lookahead: false
      use_rotate_to_heading: false
      rotate_to_heading_min_angle: 0.35
      allow_reversing: false
      stateful: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      initial_transform_timeout: 15.0
      # 0.4 s (default 0.3). The RPLidar stamps at acquisition START, so a scan is
      # ~0.1 s old on arrival; extra slack keeps the costmap from discarding it on
      # minor TF timing variation ("timestamp earlier than transform cache").
      transform_tolerance: 0.4
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.05
      robot_radius: 0.14
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        observation_sources: scan camera_low
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          raytrace_max_range: 6.0
          obstacle_max_range: 6.0
        # Monocular low-obstacle cloud (sub-lidar-plane things: chair legs, cables).
        # Height-gated + in base_link at z=0, so include z~0 via a small negative
        # min height. Ranges match the detector's reliable band (~0.45-1.5 m).
        # Marking + raytrace clearing so the planner routes AROUND low obstacles and
        # stale marks clear as the camera re-observes clear floor.
        camera_low:
          topic: /camera/low_obstacles
          data_type: "PointCloud2"
          clearing: true
          marking: true
          min_obstacle_height: -0.05
          max_obstacle_height: 0.30
          # LOAD-BEARING RANGES. low_obstacle publishes clear-ray endpoints at
          # clear_range_m (1.8) on obstacle-free bearings; those must fall BETWEEN
          # obstacle_max_range and raytrace_max_range so they clear stale marks
          # without being marked as obstacles themselves. Bench-proven: without
          # those rays nothing ever raytraces a bearing that stopped seeing an
          # obstacle, so its mark persists forever (phantom obstacles accumulate).
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
          raytrace_max_range: 2.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.16

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      # Re-send the FULL costmap every cycle (default false = full grid sent once
      # at activation, then only incremental updates). explore_lite reads this
      # topic for frontiers; relying on the single latched full + updates is a
      # fragile path (a late/again-subscribing client, or missed updates, sees a
      # stale/empty costmap -> "No frontiers found"). Cheap on a small map/idle Pi.
      always_send_full_costmap: true
      global_frame: map
      robot_base_frame: base_link
      initial_transform_timeout: 15.0
      # 0.4 s (default 0.3): same reason as local_costmap — tolerate the RPLidar's
      # acquisition-start stamp lag so scans aren't dropped from the frontier map.
      transform_tolerance: 0.4
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.14
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
        restore_cleared_footprint: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        # GLOBAL GEOMETRY COMES FROM SLAM + LIDAR ONLY -- no camera_low here.
        #
        # The camera used to mark this costmap as well, so the planner would route
        # around low obstacles. Removed 2026-08-08: the global costmap is where a
        # bad mark does the most damage (it can close a doorway to the planner
        # outright, which is exactly the narrow-gap regression), and it is the
        # layer whose job SLAM's /map already does. A monocular floor-boundary
        # detector is the least trustworthy source in the stack, so it should not
        # get a vote on global geometry.
        #
        # WHAT IS KEPT: camera_low still marks the LOCAL costmap, and the collision
        # brake still reads /camera/low_obstacles directly -- so the rover still
        # stops for the sub-lidar obstacles it could not see before (the chair-leg
        # / shoe case, hardware-validated 2026-08-05/06). Safety is unchanged.
        #
        # WHAT IS LOST: in decisive mode there is no local costmap at all, so low
        # obstacles no longer influence PLANNING there -- the rover brakes for a
        # shoe rather than routing around it. That is the intended trade: braking is
        # proven, route-around never was in the field, and a phantom mark that
        # blocks a doorway costs the whole mission.
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 0.5
          raytrace_max_range: 6.0
          obstacle_max_range: 6.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 4.0
        inflation_radius: 0.16

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 1000
    wait_for_service_timeout: 5000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"

behavior_server:
  ros__parameters:
    use_sim_time: false
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Recovery behaviors: when a goal fails to make progress, the recovery BT
    # clears costmaps then tries spin / wait / backup so exploration continues
    # instead of ending. Safe now that turning works; all recovery motion still
    # passes through /cmd_vel -> collision supervisor -> driver.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    # Rotational limits for Spin; the driver's closed-loop pivot executes the
    # turn, and the collision supervisor still gates it.
    max_rotational_vel: 0.4
    min_rotational_vel: 0.4
    rotational_acc_lim: 0.8

lifecycle_manager_explore:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
