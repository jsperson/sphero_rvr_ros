explore_node:
  ros__parameters:
    use_sim_time: false
    robot_base_frame: base_link
    return_to_init: false
    costmap_topic: /global_costmap/costmap
    costmap_updates_topic: /global_costmap/costmap_updates
    visualize: true
    # Reconsider frontiers slowly enough to avoid churning goals on a 0.05 m/s rover.
    planner_frequency: 0.1
    # At 0.05 m/s, a short room-length leg plus turns can reasonably take a minute.
    progress_timeout: 90.0
    potential_scale: 3.0
    orientation_scale: 0.0
    gain_scale: 1.0
    transform_tolerance: 0.3
    min_frontier_size: 0.3
