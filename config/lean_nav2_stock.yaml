# STOCK-MIDDLE PROTOTYPE — the config half of docs/navigation_reckoning.md.
#
# NOT FLOWN. NOT MERGED. This is the exhibit beside the morning architecture decision:
# what the stack looks like if the middle layer is configured rather than hand-rolled.
#
# ============================================================================
# MEASURED 2026-08-16. The angular constants below are DERIVED, not guessed.
# ============================================================================
# Source: 03_validation/breakaway_2026-08-16/ (four runs, rubber gym flooring --
# the operating surface -- 80-83 % battery). Authority in code:
# src/sphero_rvr_core/pivot_curve.py.
#
#     in-place pivot rate ~= 0.1344 * tank_duty - 0.213     valid for duty 23..45
#     duties <= 10:  EXACTLY 0.000 rad/s, with motor packets provably written
#     duties 12..22: BIMODAL -- clean pivot or a one-tread arc that walks 16-22 cm
#     deployed band 28..45  ->  3.55 .. 5.83 rad/s
#
# THE HEADER THIS REPLACES SAID "breakaway lies in (0.4, 0.9]". THAT WAS WRONG IN
# BOTH DIRECTIONS. The rate curve is discontinuous: it jumps from zero straight to
# ~0.8-1.5 rad/s at breakaway, so 0.4 AND 0.9 both fall in a gap that NO DUTY
# PRODUCES. 0.9 was not "above breakaway" -- it was equally unexecutable, just
# unexecutable in a way that never got tested.
#
# Consequences for this file, and they are the whole point of the prototype:
#
#  * 0.4 rad/s (stock's old rotate_to_heading_angular_vel, and Nav2's Spin default)
#    was never executable by this drivetrain. The grinding that motivated the entire
#    bespoke middle is what a 0.4 rad/s request looks like when the hardware's only
#    answers are 0.000 and 0.8+. THAT IS A CONFIG FACT, NOT AN ARCHITECTURE FACT.
#  * The slowest clean in-place rotation this robot can make is 3.55 rad/s at the
#    deployed pivot_min_duty of 28. There is no such thing as a gentle pivot here.
#    Any angular constant below that is silently raised by the driver (raise-and-log)
#    rather than executed, so writing one here would be writing fiction.
#
# STILL UNMEASURED, and marked as such below rather than quietly derived from the
# pivot curve: ARC rates while driving (a different command path -- see
# docs/run_card_arc_rate_FUTURE.md), linear breakaway, and every acceleration limit.
# ============================================================================
#
# WHAT DIFFERS FROM config/lean_nav2.yaml, and why:
#
#  1. controller_server and local_costmap are LAUNCHED. They exist in the current
#     config and are never started (explore.launch.py:36 says so outright), which is
#     why Nav2's collision-checked recoveries refuse in 2 ms (D36) -- they check
#     against a local costmap that does not exist.
#
#  2. TWO ObstacleLayer instances, not one. Raytrace clearing is 2D per layer: a
#     lidar ray passing OVER a sub-lidar obstacle clears its cell. So the lidar gets
#     a layer that marks and clears, and touch/freeze marks get a layer that the
#     lidar cannot erase -- with the ToF as that layer's only clearing source.
#     This is also D42's fix: marks become POINTS and the costmap does the
#     robot-radius maths once, via inflation, instead of us painting 0.14 m discs
#     that then get inflated again.
#
#  3. SimpleProgressChecker, NOT PoseProgressChecker. Pose- counts in-place rotation
#     as progress, so a jammed-but-pivoting RVR never trips it -- which is precisely
#     tonight's failure mode, and it means the stock checker as we had it configured
#     would ALSO have missed it.
#
#  4. No DenoiseLayer: it removes small obstacle groups, and small obstacle groups
#     are exactly what a touch mark is.
#
#  5. No velocity_smoother: open-loop ramps fight the collision supervisor. RPP is
#     stateless on measured odom, so supervisor zeroing degrades cleanly into
#     FAILED_TO_MAKE_PROGRESS -> recovery instead of a fight.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.25
      downsample_costmap: false
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: true

# ============================================================================
# THE GLOBAL COSTMAP. Its absence is why the planner has never seen an obstacle.
# ============================================================================
# THE HEADLINE IS scan_layer, NOT touch. This config had no `global_costmap` section at
# all, so planner_server came up on nav2's defaults: a static layer, an obstacle layer
# SUBSCRIBED TO NOTHING ("Subscribed to Topics:" with an empty list, in the bringup log),
# and inflation. The flown `lean_nav2.yaml` has the same shape. So in this project's
# entire history THE PLANNER HAS NEVER SEEN LIVE LIDAR -- it has planned against the SLAM
# map and nothing else, blind to every change since the map was drawn. That is a
# mission-killer independent of anything to do with contact marks, and it is the larger
# behavioural change in this section: planning is now different everywhere, not just near
# marks. The control arm of the acceptance run exists to catch that.
#
# The touch layer is the second half. Measured 2026-08-18 in closed loop: a contact mark
# 0.204 m wide, with open floor on both sides and a demonstrated 0.052 m lateral budget,
# stopped the robot 0.151 m short and then ABORTED the goal rather than routing around it
# -- because RPP refused the approach locally while the planner, blind, replanned the
# identical straight path every cycle. Protection without progress. This is what turns
# "stops short and fails" into "routes around".
#
# WHY A CONTACT MARK MAY CLOSE A DOORWAY HERE WHEN THE CAMERA WAS NOT ALLOWED TO.
# The camera was removed from the global costmap on 2026-08-08 because it closed doorways
# with PHANTOMS -- sunbeams at 72 points a frame, from the least trustworthy source in the
# stack. Contact marks are CONTACT-VERIFIED: the D48 consumer requires a motor stall with
# packets written and no motion, and across mission 2 it fired on the real contact and was
# silent on all 33 clean episodes. A touch mark in a doorway means the rover HIT something
# there, and closing that route until revocation exists is correct behaviour rather than a
# false wall.
#
# THE RESIDUAL RISK, WHICH THE PHANTOM ARGUMENT DOES NOT COVER. The detector proves the
# robot STOPPED MOVING WHILE TRYING. It does not prove the place is IMPASSABLE. A tracked
# robot stalls on things it can cross with more duty -- a threshold, a transition strip, a
# rug edge, a cable -- and those live in doorways, which puts the likeliest
# true-contact-but-traversable case in the most expensive cell on the map. This is not
# hypothetical here: Scott's mat is 9.5 mm and his crossable spec is ~19 mm ("anything up
# to about 3/4in should be crossable with some push"), and the rover met that mat's edge
# on 2026-08-18. Note the near-agreement with the existing 18 mm ToF terrain gate, which
# that spec independently ratifies.
#
# SO v1 SHIPS WITH THIS LIMIT STATED: until try-harder (one bounded elevated-duty push
# before a stall is classified as blocking contact) and revocation (Jazzy's
# clear_around_pose) land, a stall at the mat edge plants a permanent mark and closes that
# route for the mission. Both are backlogged behind Scott's ruling -- "let's not get
# carried away... first thing we need to do is get the thing to navigate, walk before we
# run" -- and a flight that ends at the mat edge is the field receipt that pulls
# try-harder forward. Expected is not acceptable.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      # Full grid every cycle: explore_lite reads this topic, and the single latched full
      # + incremental updates is a fragile path for any late subscriber. It is also what
      # makes this costmap readable by a probe -- see the local costmap's
      # always_send_full_costmap: false, which cost a probe run before it was understood.
      always_send_full_costmap: true
      transform_tolerance: 0.4
      initial_transform_timeout: 15.0
      robot_radius: 0.145
      # DECLARED for the same reason as the local costmap: nav2 pads the footprint by
      # this and derives BOTH the inscribed radius inflation uses AND the polygon
      # footprint clearing erases from out of the PADDED shape. Measured (M1):
      # 16 vertices, vertex radii 0.1550-0.1591, apothem 0.1519. `robot_radius` is a
      # request; the published footprint is the answer.
      footprint_padding: 0.01
      plugins: ["static_layer", "scan_layer", "touch_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        footprint_clearing_enabled: true
        restore_cleared_footprint: true

      # LIVE LIDAR, IN THE GLOBAL COSTMAP, FOR THE FIRST TIME. Marks and clears: clearing
      # is what lets the planner forget an obstacle that has moved, and a global costmap
      # that only ever accumulates is D42 at map scale.
      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false

      # TOUCH MARKS, same rationale as the local layer: the lidar sees straight THROUGH
      # the obstacle class this exists for, so nothing sensor-clears it. NO ToF here --
      # short range, and D27's phantom class is parked rather than extinct, so the
      # least-trusted source stays out of the map where a bad mark does the most damage.
      # That is the 2026-08-08 camera precedent applied consistently.
      touch_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: touch
        footprint_clearing_enabled: true
        touch:
          topic: /contact_marks
          data_type: "PointCloud2"
          marking: true
          clearing: false
          expected_update_rate: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          # 100.0, and the reason matters MORE here than in the local costmap. This is a
          # SENSOR range, measured from the observation origin -- the origin of the
          # cloud's own frame in the global frame. /contact_marks is not a sensor: it
          # carries absolute-frame BELIEFS stamped in `map`, so the origin is the map
          # origin and any sensor-scale value gates on distance from the rover's START
          # POSE. Measured 2026-08-18 with robot-relative geometry held constant:
          # 0.5/1.0/1.5/1.9 m marked at 253; 2.1/2.5/3.0 m did not mark at all, a clean
          # cutoff at the then-configured 2.0. A global costmap exists precisely to hold
          # marks far from the start pose, so the bug is strictly worse here.
          obstacle_max_range: 100.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        # 0.30, matching the local costmap: at 0.16 the gradient was 8 mm wide and
        # the planner had no information with which to prefer clearance. See the
        # local inflation_layer for the measurement and the argument that this
        # cannot close a gap the robot could previously plan through.
        inflation_radius: 0.30

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      # SIMPLE, NOT POSE. PoseProgressChecker credits in-place ROTATION as progress,
      # and on 2026-08-16 the rover sat commanding 0.400 rad/s pivots that the motors
      # could not execute -- rotating 1.8-2.2 degrees over 2-3 s. Against
      # PoseProgressChecker's required_movement_angle that reads as "making progress"
      # and nothing trips for movement_time_allowance (30 s in the old config).
      # SimpleProgressChecker asks only for TRANSLATION, which is the honest question
      # for a robot that is supposed to be going somewhere.
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 12.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.12
      # MEASURED, and bounded from BELOW, which is counter-intuitive.
      #
      # The tightest achievable yaw tolerance is one control cycle of rotation:
      #     pivot_rate / controller_frequency = 3.55 / 20.0 = 0.178 rad
      # and that is the FLOOR, at the slowest pivot the drivetrain can make. Tightening
      # below it makes the goal unreachable by construction -- the robot overshoots,
      # turns back, overshoots, and grinds, which is the failure this whole prototype
      # exists to stop reproducing.
      #
      # 0.30 rad keeps ~1.7 control cycles of margin. Do NOT tighten below 0.20.
      # (2026-08-11's return-to-start missed heading by 24 deg = 0.42 rad and Scott
      # still called it good, so there is no operational pressure to tighten this.)
      yaw_goal_tolerance: 0.30

    FollowPath:
      # RPP DIRECTLY -- NO RotationShimController.
      #
      # The shim is the component that produced the original motor grinding: its
      # whole purpose is to stop and rotate in place to face the path, and the old
      # config ran it at rotate_to_heading_angular_vel 0.4, less than half the
      # decisive controller's 0.9 "above breakaway" pivot rate. RPP's own
      # use_rotate_to_heading gives the same pivot-then-drive behaviour with one
      # authority over the rotation rate instead of two.
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # 0.35 (was 0.20) — THE LINEAR SPEED RAISE (Scott's directive + consensus,
      # docs/design_linear_speed_raise_2026-08-19.md). Receipts: braking at 0.35
      # = 0.35*0.25 + 0.02 = 0.11 m, so the supervisor's stop_distance 0.30
      # still governs and the rover rests ~0.09 m off the nose; ToF staleness
      # travel 0.30 s * 0.35 = 0.105 m against the tof brake's 0.45 m stop
      # (0.45 > 0.30 + 0.105, margin 0.045 m); hardware headroom large (tank SI
      # ~1.5 m/s/tread). Rotation constants deliberately untouched (Scott:
      # "turns are plenty fast"). Certification: rig falsifier + field A/B vs
      # the re-fly baseline (174.5 s / 7.29 m^2 / 8 stall-kills).
      desired_linear_vel: 0.35
      lookahead_dist: 0.26
      min_lookahead_dist: 0.15
      # 0.50 (was 0.36) — caught in the design round, decided not inherited:
      # velocity-scaled lookahead at the new cruise is 0.35 * 1.3 = 0.455,
      # which the old max CLIPPED. 0.50 clears it with margin.
      max_lookahead_dist: 0.50
      lookahead_time: 1.3
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2

      # Regulation: slow for curvature and near obstacles, but never below the
      # drivetrain's floor. A "regulated" speed under breakaway is a stall.
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.30
      # STILL UNMEASURED -- and note what the pivot curve does NOT tell us. It
      # measured opposing treads in place; LINEAR breakaway (both treads driving the
      # same way) is a different regime and could sit anywhere. Given the pivot path
      # turned out to have a hard dead zone, assuming linear has none would be the
      # same mistake in a new costume. Provisional 0.10 = the supervisor's crawl
      # floor, kept until a linear sweep exists.
      # 0.15 (was 0.10), proportional to the cruise raise. NOTE, from the
      # re-fly bag: measured legitimate crawl ran 0.053-0.066 m/s, BELOW the
      # old 0.10 — RPP regulates under its own floor in approach phases, so
      # this minimum is a curvature floor, not a guarantee; the progress bar
      # derivation (coverage_explorer.yaml) accounts for that with measured
      # net-displacement rates, not this constant alone.
      regulated_linear_scaling_min_speed: 0.15

      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.60
      # MEASURED. THIS IS THE ONE THAT MATTERS, AND IT IS THE HEART OF THE A/B.
      #
      # 0.4 was stock's old value: unexecutable, and the source of the grinding that
      # motivated the fork. 0.9 was the "above breakaway" replacement: ALSO
      # unexecutable, and never tested. Neither number can be produced by any duty.
      #
      # 3.55 rad/s is the slowest CLEAN in-place rotation this drivetrain makes --
      # the curve at the deployed pivot_min_duty of 28. Anything lower is raised to
      # this by the driver anyway; writing it here keeps the layers honest about what
      # will actually happen. Anything higher is available (up to 5.83) but there is
      # no reason to spin faster than necessary near obstacles.
      rotate_to_heading_angular_vel: 3.55
      # DERIVED, and it looks absurd on purpose. See
      # docs/velocity_adapter_design_note.md.
      #
      # RPP's rotateToHeading clamps its command to an acceleration ramp measured from
      # the CURRENT SPEED reported by odom. With 1.20 the first command from rest is
      # 1.20 * (1/20 Hz) = 0.060 rad/s -- and the measured first cmd_wz in 3a was
      # exactly 0.06. Every such sub-floor command is raised by the driver to the floor
      # duty and executed at 3.55 rad/s, so the robot snaps while the controller
      # believes it is easing. Worse, after an overshoot the window is centred on a
      # large noisy measured rate, and the controller and drivetrain lock into a
      # reversal limit cycle with the acceleration clamp as the coupling.
      #
      # Required: max_angular_accel * dt >= minimum_clean_rate(pivot_min_duty)
      #           i.e.  >= 3.55 / 0.05 = 71.0 rad/s^2.  Set to 80.0 for margin.
      #
      # A small acceleration limit is NOT a safety property on this drivetrain: it
      # cannot change rotation speed more slowly than 0 -> 3.55 in one command, because
      # nothing exists between the dead zone and the floor. A small limit is a fiction
      # that generates commands the hardware converts into what a large limit would
      # have produced anyway, minus the honesty.
      max_angular_accel: 80.0

      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # Measured extents (Scott's tape, 2026-08-15) -- see tests/test_footprint_
      # derivation.py. robot_radius is the circumscribed radius of that rectangle.
      robot_radius: 0.145
      # DECLARED, not defaulted, because the default was silently inflating every
      # geometric derivation in this project (M1, 2026-08-18). nav2 pads the footprint
      # by `footprint_padding` (default 0.01) and then derives BOTH the inscribed radius
      # inflation uses AND the polygon footprint-clearing erases from the PADDED shape.
      # So `robot_radius: 0.145` is not the radius the costmap uses.
      #
      # MEASURED off /local_costmap/published_footprint on the deployed binary:
      #     16 vertices, vertex radii 0.1550-0.1591 m, apothem (inscribed) 0.1519 m
      # Confirmed independently by cost (M2): a cell at diagonal distance
      # hypot(0.15,0.05)=0.1581 from a lethal cell reads 245, and
      # 252*exp(-4*(0.1581-0.1519)) = 245.8. Two readings, three decimals, agreeing.
      #
      # Kept at the default VALUE so nothing changes behaviourally -- this line exists to
      # make the number visible, because a default that participates in safety geometry
      # is a claim the config was not making out loud. Anyone deriving mark or standoff
      # geometry must use 0.1519 / 0.1591, NOT 0.145.
      footprint_padding: 0.01
      always_send_full_costmap: false
      plugins: ["scan_layer", "touch_layer", "tof_layer", "inflation_layer"]

      # LIDAR: marks AND clears. Clearing is what makes a costmap forget, and the
      # absence of forgetting is D42.
      scan_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        footprint_clearing_enabled: true
        scan:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          inf_is_valid: false

      # TOUCH MARKS: a separate instance because raytrace clearing is 2D PER LAYER.
      # A lidar ray at 0.19 m passes straight over a chair leg and would clear its
      # cell out of a shared layer -- erasing the one obstacle class this robot
      # cannot see. Here the lidar has no authority at all, and only the ToF, which
      # can actually observe the sub-lidar band, is allowed to clear.
      #
      # The mark cloud is OWNED and republished by the classifier (~1 Hz), so
      # expected_update_rate is 0.0: this source is never "stale", it is a belief the
      # owner maintains. Same pattern as kobuki_bumper2pc.
      # TOUCH MARKS: marking only. NOTHING sensor-clears this layer.
      #
      # The lidar sees straight THROUGH the obstacle class this layer exists for --
      # that is the premise of a contact mark. And as of 2026-08-18 the ToF is not a
      # clearing source here either: it CANNOT BE TRUSTED TO CLEAR WHAT IT CANNOT
      # RELIABLY SEE. Measured ~15% fill on thin targets (08-13 bench, 5 cm rail;
      # 15.6% of frames on the chair leg that stopped the 08-18 retest), so
      # raytrace-through would erase a real leg's mark within seconds of planting it.
      # Observation authority and clearing authority have different reliability
      # requirements, and the measured envelope meets only the first.
      #
      # CONSEQUENCE, STATED HONESTLY: marks here are MISSION-PERMANENT. TTL in the
      # publishing node bounds what is PUBLISHED and what reaches the mission report --
      # it does NOT un-mark the costmap. Measured on the bench 2026-08-10: a free cell
      # went cost 0 -> 100 on a mark and stayed 100 after publication stopped. This is
      # a deliberate v1 choice, not decay wearing a TTL's clothes. Revocation would
      # need a different mechanism (Jazzy's clear_around_pose is the v2 candidate).
      #
      # footprint_clearing_enabled TRUE is the anti-D43 defence: the robot's own cell
      # can never stay buried by its own planting. Combined with leading-edge mark
      # placement (freeze_mark_pose puts the mark at footprint_front + margin, born
      # OUTSIDE the footprint), self-burial is defended two independent ways -- and a
      # later legitimate approach stops at the lethal boundary before the footprint
      # could reach the mark, so the mark survives its planter.
      touch_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: touch
        footprint_clearing_enabled: true
        touch:
          topic: /contact_marks
          data_type: "PointCloud2"
          marking: true
          clearing: false
          expected_update_rate: 0.0
          min_obstacle_height: 0.0
          max_obstacle_height: 0.5
          # WAS 2.0, AND THAT WAS A LATENT MISSION-KILLER. `obstacle_max_range` is a
          # SENSOR range: nav2 measures it from the OBSERVATION ORIGIN, which is the
          # origin of the cloud's own frame expressed in the global frame. Every other
          # source here publishes in a sensor frame, so that origin is the sensor and the
          # gate means what it says. `/contact_marks` is NOT a sensor -- contact_marker
          # publishes absolute-frame BELIEFS stamped in `map` -- so the origin is the MAP
          # ORIGIN, and a 2.0 m gate meant "within 2 m of wherever the rover started".
          #
          # MEASURED 2026-08-18, robot-relative geometry held constant (mark always 0.5 m
          # ahead of the robot, so clearing/inflation/window are identical at every
          # sample) while only the distance from the map origin varied:
          #     0.5 m -> 253    1.0 m -> 253    1.5 m -> 253    1.9 m -> 253
          #     2.1 m -> 0      2.5 m -> 0      3.0 m -> 0
          # A clean cutoff at exactly the configured 2.0. Contact marks planted more than
          # 2 m from the start pose were being silently discarded by the one layer that
          # exists to hold them -- so the touch port worked in the first room and nowhere
          # else. The worst kind of defect: it passes every near-field test.
          #
          # 100.0 is "no gate": points outside the rolling window are dropped by the
          # window anyway, so this bounds nothing real. It must be mirrored on any global
          # costmap touch layer, where the distances are larger and the bug is worse.
          obstacle_max_range: 100.0

      # THE ToF, IN ITS OWN LAYER, where it may clear what it marks.
      #
      # Split from touch_layer on 2026-08-18. The old shared layer forced one clearing
      # policy onto two sources with different trust profiles: removing ToF clearing to
      # protect touch marks would have made ToF marks -- including any phantom, since
      # D27's class is parked rather than extinct -- mission-permanent too. Separate
      # layers let each rationale live where it is true: the ToF is self-consistent
      # (it may erase its own returns), touch marks are erased by nothing.
      tof_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: tof
        footprint_clearing_enabled: true
        tof:
          topic: /tof/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          expected_update_rate: 0.0
          obstacle_min_range: 0.17
          obstacle_max_range: 0.60
          raytrace_min_range: 0.17
          raytrace_max_range: 0.60
          min_obstacle_height: 0.02
          max_obstacle_height: 0.20

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        cost_scaling_factor: 4.0
        # 0.30, RAISED FROM 0.16 ON 2026-08-18 BECAUSE 0.16 LEFT NO GRADIENT AT ALL.
        #
        # 0.16 dates from the bespoke era, chosen before anyone measured the footprint it
        # interacts with -- the same family as everything M1 touched. Measured (M1) the
        # deployed circumscribed radius is 0.1591 and the inscribed radius is 0.1519. So
        # at 0.16 the cost profile was:
        #
        #     distance from a lethal cell      cost
        #     <= 0.1519 (inscribed)            253
        #        0.1519 .. 0.160                253 -> 0   <-- the entire gradient: 8 mm
        #     >  0.160                           0
        #
        # An inflation radius equal to the circumscribed radius means NO GRADIENT EXISTS,
        # so the planner had no information with which to prefer clearance. SmacPlanner2D
        # therefore planned the shortest path, hugging the boundary with its centre
        # 0.161 m from a lethal cell -- and RPP, which projects the FOOTPRINT (0.1591)
        # along that path, refused it: "detected collision ahead", repeatedly, until the
        # goal aborted. The planner's "free" corridor cleared the controller's
        # requirement by 0.9 mm and tracking error decided the outcome.
        #
        # A/B in the closed-loop rig, open map, mark at 0.60, goal at 1.10:
        #     0.16 -> ABORTED,   max x 0.533, detour 0.240, closest approach 0.161
        #     0.30 -> SUCCEEDED, max x 1.002, detour 0.327, closest approach 0.223
        #
        # THIS CANNOT CLOSE A GAP THE ROBOT COULD PREVIOUSLY PLAN THROUGH, which is the
        # P1 "46 % inscribed window" worry and the reason to state the mechanism rather
        # than assert safety. Read off `computeCost` in the deployed inflation_layer.hpp:
        # cells within `inscribed_radius_` get 253, everything beyond DECAYS to 0 at
        # `inflation_radius`. `inscribed_radius_` is derived from the footprint polygon,
        # not from this value. Raising it therefore leaves the blocking region byte for
        # byte unchanged and only widens the band of traversable-but-costly cells --
        # tight gaps become expensive rather than forbidden, which is what P1 wanted.
        #
        # WATCH ON THE FLIGHT: RPP's regulated velocity scaling slows near obstacles, so
        # a wider band means a slower rover near furniture, and in a 0.4 m corridor
        # nearly every cell becomes costly, which shifts route preference in tight
        # spaces. Expected, watched, not a mystery.
        #
        # With marks painted as POINTS rather than robot-radius discs, this remains the
        # ONLY place the robot's size enters -- D42's double-booking fix is untouched.
        inflation_radius: 0.30

# ============================================================================
# BT NAVIGATOR. This section did not exist, and its absence drove a robot.
# ============================================================================
# No-section family, member THREE (planner_server and global_costmap were one and
# two): with no `bt_navigator` section this node ran pure nav2 defaults, including
# `default_server_timeout` = 20 ms -- the budget the BT gives an action server to
# ACKNOWLEDGE a goal. On 2026-08-18 (run 3c, goal 3) a load spike sagged
# controller_server's loop from 20 Hz to 8.2 Hz (~122 ms periods); the BT timed out
# at 20 ms and ABORTED the mission -- but the controller had already accepted
# follow_path server-side, and when its starved executor caught up it drove the
# robot for 2.8 s (0.135 m, +82 deg) with NO OWNER: bt dead, operator told the goal
# failed, wheels turning. RPP's own collision check happened to end it. Same flight,
# goal 1: "Failed to get result for compute_path_to_pose in node halt!" -- the same
# family, halt flavour.
#
# Every value below is EXPLICIT so that changing it is a decision with a diff, never
# a default drifting underneath us -- defaults-by-decision, not defaults-by-omission
# (tests/test_stock_middle_config.py holds every nav2 node the stock launch starts
# to that rule).
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    # 1000 ms, DERIVED: the measured starvation class is a controller loop at 8.2 Hz
    # (~122 ms per cycle, run 3c under load ~8), so ack delays run to several hundred
    # ms exactly when the system is least healthy; 1000 ms covers ~8 starved cycles.
    # The cost is honest and small: a genuinely dead server now stalls the BT 1 s
    # instead of 20 ms -- nothing at mission scale. What the 20 ms default bought was
    # an abort that DID NOT STOP THE ACTUATOR, which is no safety at all.
    default_server_timeout: 1000
    bt_loop_duration: 10
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    # MEASURED. The ecosystem already agreed with us here: Spin's min_rotational_vel
    # exists precisely so a minimum-effective-speed base never receives a
    # sub-threshold command. Nav2's default is 0.4 -- the exact value that does
    # nothing on this robot, and 0.9 would have done nothing either.
    #
    # 3.55 = the curve at pivot_min_duty 28, the slowest clean pivot available.
    # 5.83 = the curve at pivot_max_duty 45, the fastest the deployed band allows.
    min_rotational_vel: 3.55
    max_rotational_vel: 5.83
    # Same defect, same fix: Spin ramps from the measured speed too, so 1.20 emits the
    # identical sub-floor train. See max_angular_accel above.
    rotational_acc_lim: 80.0

# ============================================================================
# THE LIFECYCLE MANAGER. Its absence is why this config had never started.
# ============================================================================
# Added 2026-08-17 during 3a pre-flight, BEFORE any wheels turned. Without this
# section `node_names` is uninitialized, and nav2_lifecycle_manager does not
# degrade -- it throws ParameterUninitializedException and dies at startup with
# exit code -6. The four servers then sit in `unconfigured` forever, PRESENT in
# `ros2 node list` and doing nothing, which is exactly the costume slam_toolbox
# wears when launched without autostart.
#
# This config had never been flown, so nothing had ever needed the manager to
# exist. A config file is a claim about a system that runs; this one was missing
# the section that makes it run at all.
#
# controller_server is in the list ON PURPOSE and is the entire point of the
# stock middle: explore.launch.py's decisive path manages only planner/behavior/bt,
# because in that mode controller_server is never started.
lifecycle_manager_explore:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - planner_server
      - controller_server
      - behavior_server
      - bt_navigator
