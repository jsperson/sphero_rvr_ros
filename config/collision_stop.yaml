lidar_collision_stop_supervisor:
  ros__parameters:
    requested_cmd_topic: /cmd_vel
    motor_cmd_topic: /cmd_vel_motor
    scan_topic: /scan
    diagnostics_topic: /diagnostics
    state_topic: /collision_stop/state
    events_topic: /collision_stop/events
    driver_stop_service: /rvr_driver/stop
    driver_estop_service: /rvr_driver/estop
    driver_clear_estop_service: /rvr_driver/clear_estop
    driver_service_timeout_s: 1.0
    base_frame: base_link
    laser_frame: laser
    tf_timeout_s: 0.05
    max_scan_age_s: 0.30
    # Source stamps mark acquisition start on the installed RPLidar driver.
    # This is a source-provenance sanity ceiling, not the stream-loss clock.
    # Receipt age still forces zero at 0.30 s, before the 0.5 s driver watchdog.
    max_scan_stamp_age_s: 0.75
    startup_grace_s: 2.0
    min_valid_ranges: 12
    min_valid_fraction: 0.05
    min_range_m: 0.08
    max_range_m: 6.0
    sector_unknown_policy: blocked
    # TRUE nose geometry: base_link sits at the robot center (lidar mounted at
    # x=0.0045), and the RVR is ~0.216 m long, so the physical front is ~0.108 m
    # forward. Was 0.22 — a ~2x conservative placeholder that doubled the front
    # standoff. 0.11 = true nose + ~2 mm. This is the SAFETY floor: do not go
    # below the real nose or the rover measures clearance from inside its body.
    # Actual standoff comes from payload_margin + braking below.
    footprint_front_m: 0.11
    footprint_rear_m: 0.16
    footprint_left_m: 0.10
    footprint_right_m: 0.10
    # No payload overhangs the front bumper, so keep this small — it only pads
    # the physical footprint. Was 0.05; trimmed to tone down the stop bubble.
    payload_margin_m: 0.02
    front_stop_min_angle_deg: -30.0
    front_stop_max_angle_deg: 30.0
    # ±35° (was ±45°) so the lateral edges of a wide-enough gap don't sit in the
    # front-slow cone and needlessly throttle a pass the rover clearly fits.
    front_slow_min_angle_deg: -35.0
    front_slow_max_angle_deg: 35.0
    rear_stop_angle_width_deg: 30.0
    left_spin_min_angle_deg: 45.0
    left_spin_max_angle_deg: 135.0
    right_spin_min_angle_deg: -135.0
    right_spin_max_angle_deg: -45.0
    # Non-binding floor now. Effective hard-stop = max(stop_distance,
    # footprint_front + payload_margin + braking) = max(0.12, 0.11 + 0.02 +
    # 0.045) = ~0.175 m from base_link = ~0.067 m (~6.7 cm) off the physical
    # nose. The physics term (footprint + braking) governs; stop_distance only
    # floors it. Toned 0.35 -> 0.12 so it no longer inflates the stop.
    stop_distance_m: 0.30
    # 0.20 (was 0.45). Small SLOW band just above the ~0.175 m stop — a brief
    # ease-off, then the hard stop. Must stay > stop_distance_m.
    slow_distance_m: 0.50
    reverse_stop_distance_m: 0.25
    # Added to every footprint edge during command-trajectory projection.
    trajectory_clearance_margin_m: 0.02
    # 0.25 (was 0.50). 0.50 s to stop from a <=0.10 m/s crawl was very
    # conservative and inflated the dynamic braking bubble; the tank drive halts
    # far faster than that. Halving it pulls the effective stop distance in.
    measured_stop_time_s: 0.25
    braking_distance_margin_m: 0.02
    # 0.30 (was 0.45). Hysteresis above the ~0.175 m stop so it doesn't chatter,
    # but low enough that a short back-off re-opens clearance and lets it resume
    # — 0.45 would have forced ~0.28 m of backing before the latch cleared.
    release_distance_m: 0.40
    release_time_s: 0.50
    # 0.70 (was 0.0). 0.0 let the SLOW zone scale speed straight down through the
    # sub-breakaway range, where the tank motors grind instead of rolling. Floor
    # the scale so in the SLOW band the rover slows only to ~0.7x, then the hard
    # STOP cuts it to zero cleanly — slow-then-stop, never creep-and-grind.
    min_forward_scale: 0.70
    requested_cmd_timeout_s: 0.25
    reset_policy: auto_after_clear
    zero_publish_period_s: 0.10
    # 0.20 (was 0.10). This is the FINAL speed gate — it clamps every motion
    # command, so a 0.10 here silently halved the controller/driver's 0.20 cruise
    # and held the motors near breakaway (high torque, low speed = heat). Matched
    # to the driver's max_linear_mps and the decisive cruise so the rover actually
    # runs at 0.20. Braking at 0.20 is ~0.07 m -> effective stop ~0.20 m (~9 cm off
    # the nose), still safe.
    max_forward_mps: 0.20
    max_angular_rad_s: 0.4
    allow_disable: false
    fail_on_missing_tf: true
    # --- Low-obstacle brake (additive to the lidar core) ---
    # Stops forward motion for LOW obstacles the 2D lidar misses (chair legs, a
    # shoe, a floor cable). It can ONLY slow/stop forward motion (never
    # reverse/turn), and only acts on a fresh cloud, so a dead or disabled source
    # leaves lidar behaviour unchanged.
    #
    # WIRED TO THE ToF, 2026-08-13. The camera lost this slot the same day (its mount
    # moved and its aim is unmeasured -- Scott: "any feedback would be terrible"). The
    # ToF measures range directly, so nothing here depends on a mount aim being right.
    #
    # RULE B IS GATED OFF (TofConfig.rule_b_enable = False) until bench item J pins its
    # disagreement margin against a synchronised /scan. Rule A flies without J; rule B
    # does not. /tof/state reports rules=rule_a_only so a recording can never be
    # misread as B-protected. Flipping the gate requires a pinning citation on its own
    # comment line here, in the form enforced by tests/test_tof_brake_derivation.py --
    # the exact token is deliberately not written out in this sentence, because a guard
    # that a mere MENTION satisfies is a guard that prose can defeat.
    low_obstacle_brake_enable: true
    low_obstacle_topic: /tof/obstacles
    # EVERY DISTANCE BELOW IS RE-DERIVED FOR THIS SENSOR. The camera's 0.50/0.70/0.40/
    # 1.20 came from ITS blind zone and mean nothing here -- carrying them over would
    # have set a stop distance 0.20 m beyond anything the ToF can see.
    #
    # RE-DERIVED 2026-08-13 IN THE TRUE base_link FRAME. Every range below was set when
    # `zone_point` omitted the sensor's 0.10 m forward offset, so every one of them was
    # compared against ground ranges that were 0.10 m short.
    #
    # AND YET THEY WERE RECOMPUTED RATHER THAN SHIFTED BY 0.10, because two different
    # quantities move by two different amounts and only one of them is the offset:
    #   * a RETURN's ground range moves by the offset almost exactly (+0.0891 to
    #     +0.0998 m across all 64 zones -- x dominates a forward-looking ground range);
    #   * a zone's FLOOR moves from "what it reads" to "where it is" by +0.070 to
    #     +0.108 m, because that comparison crosses the boresight projection as well as
    #     the offset. That is the one rule A's authority bound uses, and it is what
    #     pushed row 4 out of the row set.
    # Shifting every constant by 0.10 would have kept the arithmetic and lost the row.
    #
    # Detection reach with rule A alone is 0.297 m of ground range, at zone (5,0):
    # row 5's floor reads 0.330 m from the sensor and the 0.12 m floor margin sits
    # between the floor and the trigger (design 11.1). NOTE THE ROW CHANGE: the old
    # 0.298 m figure was row 4's, and row 4 no longer holds authority, because its
    # floor is 0.512 m from base_link rather than the 0.434 m it READS. The reach is
    # almost unchanged (0.298 -> 0.297) and the row that supplies it is different --
    # which is why "the number did not move" is never on its own evidence that nothing
    # did.
    #
    # The rover must physically stop within footprint_front 0.11 + payload_margin 0.02
    # + braking 0.02..0.045 = 0.150..0.175 m from base_link.
    #
    # 0.20 m sits above the conservative 0.175 m requirement and 0.097 m inside the
    # 0.297 m detection -- about half a second of approach at the 0.20 m/s cruise, and
    # 0.09 m clear of the physical nose. It is deliberately NOT pushed nearer the
    # detection limit: the floor margin it depends on is still provisional until the
    # in-flight pitch envelope is measured (design 3.3). UNCHANGED at 0.20.
    low_obstacle_stop_distance_m: 0.20
    # >= rule A's true reach (0.297 m), so the rover is already easing off through the
    # whole approach rather than braking flat from cruise. 0.30 clears it by 3.3 mm.
    # UNCHANGED, and the tightness is deliberate rather than lucky: the failure
    # direction is a harsher stop, not a missed one, so the cheap fix if the reach ever
    # grows past it is to widen this rather than to re-argue the reach.
    low_obstacle_slow_distance_m: 0.30
    # Symmetric +-30 deg: this sensor's field, not the camera's lopsided lens. Used only
    # when swept_path is false.
    low_obstacle_half_angle_deg: 30.0
    # The nearest ground range the sensor can report in the TRUE frame is 0.1517 m, at
    # zone (7,3) with the 60 mm `min_valid_mm` floor. The old 0.08 was derived from the
    # broken frame's 0.052 m and sat ABOVE it, discarding the nearest 28 mm of real
    # returns as untrustworthy edge-of-field.
    #
    # 0.14 sits just BELOW the true nearest reportable range, so the window discards
    # nothing the sensor can actually produce, with ~12 mm of allowance for calibration
    # drift before it would start discarding again. THIS CHANGES NO BEHAVIOUR TODAY --
    # nothing can be published below 0.1517 m either way -- and that is the point: the
    # old value was inert AND wrong, and an inert wrong number is the kind that gets
    # believed later. The safe direction here is downward: a near edge set too high
    # silently drops the closest obstacles, which are the ones there is least time for.
    low_obstacle_min_range_m: 0.14
    # The binding requirement is only `>= low_obstacle_slow_distance_m` (0.30) -- the
    # brake takes no action on anything further, so a wider window cannot cause one.
    # 0.60 buys headroom on purpose: it covers rule B's true reach of 0.598 m (row 3,
    # 0.498 m in the broken frame), so pinning rule B needs no second change here.
    # Nothing is published beyond rule A's 0.297 m while B is gated.
    low_obstacle_max_range_m: 0.60
    low_obstacle_min_forward_scale: 0.60
    # ~2 frames at the measured 6.5-7.6 Hz (2 / 6.5 = 0.308 s). THE BUDGET IS TRAVEL,
    # NOT TIME: at the 0.20 m/s cruise, 0.30 s of stale data is 0.060 m of travel, and
    # it must stay inside the approach window -- reach 0.297 minus stop 0.20 = 0.097 m
    # in the true frame. 0.060 < 0.097, so the rover cannot cross the whole window on a
    # single stale frame. (0.6 s, the camera's at 5 Hz, would be 0.12 m: more than the
    # window it is supposed to protect.) The window moved with the re-derivation --
    # 0.098 -> 0.097 m -- so this constant was re-checked against it rather than
    # assumed to still hold. UNCHANGED at 0.30.
    low_obstacle_max_age_s: 0.30
    # Robot geometry, sensor-independent: unchanged from the camera era.
    low_obstacle_swept_path: true
    low_obstacle_half_width_m: 0.16
