camera_node:
  ros__parameters:
    # Pi Camera 3 stream shape validated during stationary camera/lidar closeout.
    width: 800
    height: 600
    # camera_ros publishes this mode as rgb8 with 800x600 and step=2432. Consumers
    # that inspect pixels must crop each row to 2400 bytes before reshaping.
    format: BGR888
    camera: 0
    role: viewfinder
    camera_frame_id: camera_link
    camera_optical_frame_id: camera_optical_frame
    # Robot-local calibrated CameraInfo generated from the verified 800x600
    # checkerboard calibration run.
    camera_info_url: file:///home/jsperson/.ros/camera_info/rvr_pi_camera3_800x600.yaml
