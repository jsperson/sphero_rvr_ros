coverage_explorer:
  ros__parameters:
    # Coverage + frontier mission: drive until every reachable free cell has been
    # both seen (no frontiers) AND approached within coverage_radius_m.
    coverage_radius_m: 0.75
    # Skip target clusters smaller than this (sensor/edge noise).
    min_cluster_cells: 5
    # Also pursue frontiers (discover new space), not just cover known space.
    include_frontiers: true
    # A map cell is free when 0 <= value <= this (0 = strict trinary SLAM map).
    free_threshold: 0
    # Target from SLAM /map, not the global costmap: /map has free directly
    # adjacent to unknown (proper frontiers), whereas the costmap's inflation sits
    # between free and unknown near walls and starves target detection. (A run
    # against the costmap declared "complete" immediately with 0 goals; /map
    # explores thoroughly.) Whether a /map target is actually drivable is settled
    # per-goal by ComputePathToPose, so /map's optimism costs a planner query, not
    # a churning goal.
    map_topic: /map
    # REACHABILITY IS THE PLANNER'S. Candidates are proposed nearest-first and each
    # is checked with ComputePathToPose until one plans; the first that plans is
    # sent. This caps how many queries one selection may cost. The map is re-read
    # every cycle, so exhausting the cap is never permanent.
    max_candidates: 12
    plan_timeout_s: 2.0
    # Ceiling on one whole selection, so a slow planner can't stall the explorer for
    # max_candidates * plan_timeout_s. Exhausting the budget is logged and the cycle
    # is treated as inconclusive — never as "nothing is plannable".
    select_budget_s: 6.0
    # Declare the mission complete only after this many CONSECUTIVE empty searches
    # (and only after it has actually found targets) — avoids latching "complete"
    # on a transient/startup empty map.
    complete_after_empty_cycles: 20
    # Goal-progress watchdog: a goal that PLANNED but then makes < epsilon progress
    # within the timeout gets dropped -- planning is not what failed, so re-asking
    # the planner would just get the same yes.
    goal_progress_timeout_s: 6.0
    goal_progress_epsilon_m: 0.10
    base_frame: base_link
    cycle_period_s: 1.0
    # Stop proposing a spot for a while once a DRIVE there failed -- stalled, aborted
    # or rejected. All three mean something stopped the robot that the planner cannot
    # see, so re-asking the planner just gets the same yes and the rover drives at it
    # again. Radius is derived from the ROBOT (~robot_radius 0.14 plus margin): a
    # failure says nothing about ground more than about one footprint away. Narrow and
    # expiring, unlike the old permanent blacklist that wrote off 73% of free space.
    stall_suppress_radius_m: 0.2
    stall_suppress_ttl_s: 45.0
    # Give up when goals fail EVERYWHERE. Failures at different destinations mean the
    # stack is broken, not the room. On 2026-08-09 a stuck controller failed 82 of 93
    # goals in ~70 ms each and the rover thrashed back and forth for two minutes;
    # this stops that after 5 and reports ABORTED_GOALS_KEEP_FAILING.
    max_consecutive_failures: 5
    # A mission should end with an ANSWER, not a log line someone has to find. On end,
    # publish a latched JSON report (outcome as a FIELD, not prose -- "covered
    # everything" and "ran out of reachable targets" are different outcomes and must
    # never collapse) and write the map next to it.
    report_topic: /coverage_explorer/report
    save_map_on_end: true
    # Written straight from the OccupancyGrid, so saving does not depend on
    # nav2_map_server being alive at the one moment it matters. A 34-minute SLAM map
    # was lost to a stack restart on 2026-08-08 and took an A/B with it.
    map_save_dir: ~/.ros/missions
    # Refuse to issue goals when the robot's OWN costmap cell is at/above inscribed
    # cost. In that state the planner treats the start as in collision, EVERY goal
    # returns "no valid path", and Nav2's motion recoveries are all collision-blocked
    # -- so every candidate would be refused and the explorer would report a false
    # end-of-mission while going nowhere (2026-08-07: 0.26 m rear clearance vs the
    # inflation_radius envelope burned a four-minute run). Fails OPEN: an unknown
    # cell or a missing costmap never halts exploration.
    blocked_start_check: true
    costmap_topic: /global_costmap/costmap
