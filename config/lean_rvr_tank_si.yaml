sphero_rvr_driver:
  ros__parameters:
    serial_port: /dev/ttyAMA0
    baud_rate: 115200
    cmd_vel_timeout: 0.5
    control_period: 0.05
    safety_dispatch_timeout_s: 0.20

    # Get-Well Phase 2b clean path. Every Twist is converted to left/right SI
    # tread velocity in RVRDriver and sent with drive_tank_si_units, the command
    # physically proven smooth at 0.05 m/s. The deployed rvr.yaml stays intact.
    velocity_control_mode: native_tank_si
    # 0.35 (was 0.20) — the speed raise's driver gate; moves ONLY together with
    # RPP desired_linear_vel and the supervisor's max_forward_mps (the three-
    # gates rule, test-pinned in tests/test_speed_raise.py).
    max_linear_mps: 0.35
    max_angular_rad_s: 0.4

    # Pivot (in-place turn) tuning — floor above the weak-direction breakaway so
    # short turns have force; gentle gain to avoid closed-loop oscillation.
    pivot_min_duty: 28
    pivot_max_duty: 45
    # TRUE as of the 2026-08-19 bench card (docs/bench_card_2026-08-19.md),
    # flipped in a reviewed commit citing the measured numbers: (i) estop
    # preempted a live firmware turn -- Scott: "It was really fast. I'd say
    # pass."; (ii) supervisor stop likewise -- "This is apass as well.";
    # (iii) 21/21 turns, LEFT mean|err| 2.2 deg / worst 4.8, RIGHT 1.0 / 2.0 --
    # "very strong pass... all turns deliberate and well executed."
    precise_turn_bench_verified: true
    pivot_duty_gain: 1.0

    # These raw-duty settings remain inert in native_tank_si mode and preserve
    # the shared node schema; there is no deadband or velocity smoother.
    max_raw_motor_duty: 160
    max_linear_raw_motor_duty: 64
    max_angular_raw_motor_duty: 255

    battery_publish_period: 5.0
    temperature_publish_period: 2.0
    diagnostics_publish_period: 1.0
    diagnostics_metadata_period: 30.0
    motor_diagnostics_poll_period: 0.5
    ambient_light_publish_period: 2.0
    odom_publish_period: 0.1

    # The same track width drives both tank-SI kinematics and odometry.
    odom_counts_per_meter: 4337.768
    odom_wheel_track_m: 0.2507
    odom_frame_id: odom
    base_frame_id: base_link
    odom_publish_tf: true
    odom_pose_xy_covariance: 0.05
    odom_pose_yaw_covariance: 0.25
    odom_twist_linear_covariance: 0.10
    odom_twist_angular_covariance: 0.50
