live_route_runner:
  ros__parameters:
    route_request_topic: /mission_api/v2/live_route/request
    status_topic: /mission_api/v2/live_route/status
    diagnostics_topic: /diagnostics
    cmd_vel_topic: /cmd_vel
    # Phase 1 remains replay/simulation only. Enabling this mode additionally
    # requires use_sim_time:=true in the node and disables legacy route input.
    hierarchical_mode_enabled: false
    nav2_cmd_topic: /nav2_cmd_vel_request
    nav2_cmd_lease_s: 0.25
    hierarchical_max_linear_mps: 0.10
    hierarchical_max_angular_rad_s: 0.4
    # The installed tracks stalled on the office ridge even when DWB requested
    # 0.086 m/s. Apply the existing 0.10 m/s mission ceiling as a breakaway
    # floor only while the independent collision state is CLEAR; the downstream
    # supervisor retains authority to scale or zero this request.
    hierarchical_clear_breakaway_linear_mps: 0.10
    # Attended testing established that 0.15 and 0.25 rad/s pure turns stall
    # while 0.35 rad/s breaks the installed skid-steer drivetrain free. Apply
    # this only to near-pure turns on CLEAR paths; mixed arcs retain Nav2's
    # requested angular rate.
    hierarchical_clear_breakaway_angular_rad_s: 0.35
    # Raw-duty breakaway turns were measured near 3.2 rad/s even though Nav2
    # requested 0.35 rad/s. Emit one 50 ms breakaway pulse only after the
    # signed Nav2 yaw budget accumulates enough angle. A sign reversal resets
    # the budget, preventing alternating 10 Hz planner corrections from being
    # amplified into full-torque left/right oscillation.
    hierarchical_clear_breakaway_angular_measured_rate_rad_s: 3.2
    hierarchical_clear_breakaway_angular_pulse_s: 0.05
    # Keep obstacle escape at the physically proven gentler reverse speed.
    # Rear-sector and swept-trajectory vetoes remain authoritative.
    hierarchical_reverse_escape_linear_mps: 0.07
    scan_topic: /scan
    odom_topic: /odom
    encoder_counts_topic: /encoder_counts
    collision_state_topic: /collision_stop/state
    stop_state_topic: /mission_api/v2/control_state
    control_period_s: 0.05
    base_frame: base_link
    laser_frame: laser
    fail_on_missing_tf: true
    tf_timeout_s: 0.05
    min_valid_ranges: 12
    min_valid_fraction: 0.05
    min_range_m: 0.08
    max_range_m: 6.0
    sector_unknown_policy: blocked
    clearance_margin_m: 0.40
    min_translation_cap_m: 0.01
    max_translation_segment_m: 0.75
    collision_state_max_age_s: 0.30
    track_counts_per_meter: 4337.768
    terminal_settle_time_s: 0.50
    terminal_settle_timeout_s: 2.0
    terminal_settle_distance_m: 0.005
    terminal_settle_angle_rad: 0.017453292519943295
    terminal_settle_encoder_counts: 8
    max_terminal_distance_error_m: 0.03
    # Adaptive mission is capability-focused: a settled turn within 10 degrees is
    # sufficient to continue closed-loop replanning. This does not relax any
    # collision, freshness, speed, STOP/ESTOP, lease, or timeout gate.
    max_terminal_angle_error_rad: 0.17453292519943295
    # A stationary undershoot may be corrected only within the original
    # correlated turn intent and its 5 s timeout. Overshoot and safety
    # terminals never re-engage. Each correction emits exactly one nonzero
    # command at the fixed 20 Hz control period, followed by a mandatory
    # zero-and-settle check, so the slower 10 Hz odom stream cannot refresh a
    # correction while waiting for feedback.
    max_turn_corrections: 3
    distance_tolerance_m: 0.01
    angle_tolerance_rad: 0.034906585
    # Attended straight runs showed one 10 Hz odom period plus drivetrain
    # coast after zero. Keep the longer translational horizon separate from
    # the measured turn response; settled terminal error remains authoritative.
    target_stop_horizon_s: 0.25
    # Exact-SHA turn traces measured roughly 0.10 s of angular travel after the
    # release sample. The prior shared 0.25 s horizon stopped at 18.76 degrees.
    turn_target_stop_horizon_s: 0.10
    # The collision supervisor still owns the absolute 0.4 rad/s ceiling.
    # 0.15 and 0.25 rad/s both stalled the installed drivetrain.  The
    # turn-only controller therefore uses the lowest validated breakaway
    # command while predictive braking and bounded stationary correction limit
    # the settled angle.
    max_turn_speed_rad_s: 0.35
    # The exact-SHA 45-degree Adaptive mission run measured 3.21 rad/s of odometry yaw
    # while the bounded request remained 0.35 rad/s. Use authoritative measured
    # progress for target braking, capped above that observation so a malformed
    # encoder jump cannot reserve an unbounded stopping distance.
    max_turn_progress_rate_rad_s: 3.5
    heading_kp: 1.5
    max_heading_correction_rad_s: 0.6
    max_sample_age_s: 0.30
    stall_timeout_s: 0.75
    startup_grace_s: 1.50
    # The 2026-07-24 attended 10 cm run advanced continuously to 44.4 mm,
    # but the former 15 mm activity checkpoint falsely expired the stall timer.
    # Five millimetres is about 22 encoder counts at the reviewed scale and
    # remains separate from target, settle, timeout, and safety acceptance.
    min_progress_m: 0.005
    min_angle_progress_rad: 0.034906585
