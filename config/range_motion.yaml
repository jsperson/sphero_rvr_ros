range_motion_controller:
  ros__parameters:
    goal_topic: /range_motion/goal
    status_topic: /range_motion/status
    cmd_vel_topic: /cmd_vel
    scan_topic: /scan
    odom_topic: /odom
    diagnostics_topic: /diagnostics
    base_frame: base_link
    laser_frame: laser
    max_speed_mps: 0.20
    min_speed_mps: 0.04
    acceleration_mps2: 0.40
    slowdown_distance_m: 0.20
    target_tolerance_m: 0.01
    max_sample_age_s: 0.30
    rate_window_s: 0.75
    min_front_clearance_m: 0.12
    min_rear_clearance_m: 0.12
    min_side_clearance_m: 0.12
    max_range_jump_m: 0.35
    stall_timeout_s: 0.75
    min_progress_m: 0.015
    max_odom_lidar_disagreement_m: 0.12
    min_valid_ranges: 12
    min_valid_fraction: 0.05
    min_range_m: 0.08
    max_range_m: 6.0
    sector_unknown_policy: blocked
    fail_on_missing_tf: true
    tf_timeout_s: 0.05
    service_goal_direction: forward
    service_goal_mode: approach
    service_goal_target_clearance_m: 0.1016
    service_goal_max_measured_displacement_m: 1.0
    service_goal_timeout_s: 8.0
