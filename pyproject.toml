[project]
name = "sphero-rvr-ros"
version = "0.1.0"
description = "Concurrency-safe Sphero RVR core driver and ROS 2 adapter"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Jason Scott Person" }]
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
ros2 = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sphero_rvr_core", "src/sphero_rvr_driver"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
